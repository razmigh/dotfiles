###########################
###  Configuration
############################

unbind C-b
set-option -g prefix C-a

# set Zsh as your default Tmux shell
# set-option -g default-shell /usr/bin/zsh

# increase scroll-back history
set -g history-limit 10000

# use vim key bindings
set-window-option -g mode-keys vi

# So this option has been renamed in version 2.1 (18 October 2015)
# http://stackoverflow.com/questions/11832199/tmux-set-g-mouse-mode-on-doesnt-work
setw -g mouse on

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 1

# Set the numbering of windows to go from 1 instead of 0 - silly programmers :|
set -g base-index 1

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
# Basically allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. 
setw -g aggressive-resize on

# focus events enabled for terminals that support them
set -g focus-events on

# Set parent terminal title to reflect current window in tmux session 
set -g set-titles on
set -g set-titles-string "#I:#W [#P:#{pane_current_command}]"

# automatically renumber windows
set -g renumber-windows on

# to prevent ssh from renaming window name
set-option -g allow-rename off

###########################
###  Clipboard
############################

# Every copy (keyboard, mouse drag, double/triple click) goes to the system clipboard
# through clip-copy (pbcopy / win32yank / clip.exe / wl-copy / xsel / xclip, OSC 52 over SSH),
# and stays in the tmux buffer list as a history (prefix + = to pick one).
# Shift + mouse drag bypasses tmux and uses the terminal's own selection.

# Let tmux and apps inside it (nvim over SSH, etc.) set the outer terminal's clipboard via OSC 52.
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'

# tmux >= 3.2: used by the default mouse bindings and copy-pipe without a command.
set -sq copy-command '~/.local/bin/clip-copy --from-tmux'

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel '~/.local/bin/clip-copy --from-tmux'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel '~/.local/bin/clip-copy --from-tmux'

# Mouse (tmux >= 3.2): drag / double-click (word) / triple-click (line) copies right away and
# keeps the selection highlighted. Then Ctrl+C (or y / Enter) copies and leaves copy mode,
# a click clears the selection, q leaves. Ctrl+C never reaches the shell while in copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
  'send -M' 'copy-mode -H ; send -X select-word ; send -X copy-pipe-no-clear'
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
  'send -M' 'copy-mode -H ; send -X select-line ; send -X copy-pipe-no-clear'
bind -T copy-mode-vi C-c if -F '#{selection_present}' 'send -X copy-pipe-and-cancel' 'send -X cancel'

# prefix + ] pastes the system clipboard (falls back to the latest tmux buffer).
bind ] run-shell "~/.local/bin/clip-paste 2>/dev/null | tmux load-buffer -b system - 2>/dev/null && tmux paste-buffer -p -d -b system || tmux paste-buffer -p"

###########################
###  UI
############################

# use 256 term for pretty colors
set -g default-terminal "screen-256color"
